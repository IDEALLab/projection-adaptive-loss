name: city_10_buildings
bounds:
  x: [0, 1100]
  y: [0, 1100]
  z: [-10, 500]
  resolution: 64
  batch_size: 1

# 10-building variant, first 10 of city_20 layout.

params:
  cx1: 543.0
  cy1: 200.0
  w1: 60.0
  d1: 50.0
  h1: 120.0
  cx2: 642.0
  cy2: 208.0
  w2: 45.0
  d2: 65.0
  h2: 180.0
  cx3: 769.0
  cy3: 303.0
  w3: 70.0
  d3: 55.0
  h3: 80.0
  cx4: 872.0
  cy4: 426.0
  w4: 50.0
  d4: 50.0
  h4: 220.0
  cx5: 898.0
  cy5: 532.0
  w5: 55.0
  d5: 60.0
  h5: 140.0
  cx6: 416.0
  cy6: 232.0
  w6: 65.0
  d6: 45.0
  h6: 160.0
  cx7: 529.0
  cy7: 359.0
  w7: 50.0
  d7: 70.0
  h7: 250.0
  cx8: 656.0
  cy8: 458.0
  w8: 55.0
  d8: 55.0
  h8: 100.0
  cx9: 759.0
  cy9: 582.0
  w9: 40.0
  d9: 60.0
  h9: 200.0
  cx10: 879.0
  cy10: 688.0
  w10: 60.0
  d10: 50.0
  h10: 130.0

shapes:
  inner_domain:
    type: box
    size: [750, 750, 10]
    center: [550, 550, 0]

  b1:  {type: box, size: [$w1,  $d1,  $h1],  center: [$cx1,  $cy1,  $h1/2]}
  b2:  {type: box, size: [$w2,  $d2,  $h2],  center: [$cx2,  $cy2,  $h2/2]}
  b3:  {type: box, size: [$w3,  $d3,  $h3],  center: [$cx3,  $cy3,  $h3/2]}
  b4:  {type: box, size: [$w4,  $d4,  $h4],  center: [$cx4,  $cy4,  $h4/2]}
  b5:  {type: box, size: [$w5,  $d5,  $h5],  center: [$cx5,  $cy5,  $h5/2]}
  b6:  {type: box, size: [$w6,  $d6,  $h6],  center: [$cx6,  $cy6,  $h6/2]}
  b7:  {type: box, size: [$w7,  $d7,  $h7],  center: [$cx7,  $cy7,  $h7/2]}
  b8:  {type: box, size: [$w8,  $d8,  $h8],  center: [$cx8,  $cy8,  $h8/2]}
  b9:  {type: box, size: [$w9,  $d9,  $h9],  center: [$cx9,  $cy9,  $h9/2]}
  b10: {type: box, size: [$w10, $d10, $h10], center: [$cx10, $cy10, $h10/2]}

  city:
    type: union
    shapes: [b1, b2, b3, b4, b5, b6, b7, b8, b9, b10]

output: [city, inner_domain]
