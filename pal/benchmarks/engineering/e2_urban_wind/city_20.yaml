  b18: {type: box, size: [$w18, $d18, $h18], center: [$cx18, $cy18, $h18/2]}
  b19: {type: box, size: [$w19, $d19, $h19], center: [$cx19, $cy19, $h19/2]}
  b20: {type: box, size: [$w20, $d20, $h20], center: [$cx20, $cy20, $h20/2]}

  city:
    type: union
    shapes: [b1, b2, b3, b4, b5, b6, b7, b8, b9, b10,
             b11, b12, b13, b14, b15, b16, b17, b18, b19, b20]

output: [city, inner_domain]
