name: bwb_wing
bounds:
  x: [-1.2, 0.2]
  y: [-1.05, 1.05]
  z: [-0.125, 0.125]
  resolution: 256
  batch_size: 1
params:
  B1: 0.15
  B2: 0.125
  B3: 0.45
  C2: 0.7
  C3: 0.23
  C4: 0.075
  S1: 50.0
  S2: 50.0
  S3: 32.0
shapes:
  bwb:
    type: neural3d
    path: .
    B1: $B1
    B2: $B2
    B3: $B3
    C2: $C2
    C3: $C3
    C4: $C4
    S1: $S1
    S2: $S2
    S3: $S3
output: bwb
